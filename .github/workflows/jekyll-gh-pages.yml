name: Pages
on:
  push:
    branches:
      - master
env:
  # Run JS actions on Node 24 to silence the Node 20 deprecation warning.
  # Remove once the actions ship Node 24-based major versions upstream.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install RenderCV
        run: pip install "rendercv[full]"

      - name: Render CV
        run: |
          cd ./source/cv/
          rendercv render Vladimir_Babin_CV.yaml
          cp -r rendercv_output/* ../../public/cv/
          cp Vladimir_Babin_CV.yaml ../../public/cv/

      - name: Copy resources
        run: |
          cp -r ./resources/* ./public/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4