cv:
  name: Vladimir Babin
  headline: "Cross-Platform Mobile Engineer (KMP / Compose) · Remote since 2015"
  email: vovababin@gmail.com
  website: https://chiliec.github.io/portfolio
  social_networks:
    - network: Telegram
      username: babin
    - network: GitHub
      username: chiliec
    - network: LinkedIn
      username: vovababin

  sections:
    Summary:
      - Mobile engineer with 11 years shipping production apps, now focused on Kotlin Multiplatform and Compose Multiplatform for shared Android/iOS codebases. A deep native-iOS background (Swift, SwiftUI) means I understand both platforms from the inside, so shared code respects real platform behavior instead of fighting it.
      - Own delivery end to end — modular architecture, offline-first sync, kickoff to store.

    Experience:
      - company: "[Axveer](https://axveer.com)"
        position: Software Engineer
        location: USA, Remote
        start_date: 2026-03
        end_date: 2026-07
        highlights:
          - Delivered mobile apps across concurrent client engagements — some on shared Kotlin Multiplatform modules feeding both Android and iOS, others fully native.
          - Took each project from kickoff to a first store/TestFlight build, owning build config, signing, and release.
          - Integrated backend services and REST APIs, handling asynchronous data flow and error states in shared code.

      - company: "[Artwell](https://www.artwell.ru)"
        position: Senior Mobile Developer
        location: Remote
        start_date: 2024-06
        end_date: 2025-12
        highlights:
          - Owned a production app end to end, building state-driven UI with real-time updates.
          - Integrated TON blockchain and smart-contract state, parsing on-chain data and handling async updates.
          - Designed REST API integration and client-side data modeling with a focus on performance and UI responsiveness.

      - company: "[Symplast](https://symplast.com)"
        position: Senior iOS/macOS Developer
        location: USA, Remote
        start_date: 2021-10
        end_date: 2024-05
        highlights:
          - "Built and maintained large-scale healthcare apps used daily in US clinics — [live on the App Store](https://apps.apple.com/us/app/symplast-practice/id965799573)."
          - Drove crash-rate reduction through crash-report triage, refactoring, and defensive coding.
          - Built reactive data pipelines and implemented secure messaging, video calls, and offline-first synchronization.
          - Mentored junior developers and drove code reviews and architectural decisions.

      - company: "[Pro IT](https://proitr.ru)"
        position: Mobile Developer
        location: Russia, Remote
        start_date: 2015-02
        end_date: 2021-10
        highlights:
          - Shipped multiple production native apps, building reusable UI components and REST networking layers.
          - Automated build, test, and release pipelines with Fastlane, improving release stability.

    Technical Skills:
      - label: Cross-platform
        details: Kotlin Multiplatform (KMP), Compose Multiplatform, shared modules, expect/actual, Ktor, coroutines/Flow
      - label: Android
        details: Kotlin, Jetpack Compose, Gradle, Material
      - label: iOS & macOS
        details: Swift, SwiftUI, UIKit, Swift Concurrency (async/await, Actors), Combine
      - label: Architecture
        details: MVVM, Clean Architecture, modularization, offline-first sync
      - label: Data & Networking
        details: REST, Codable/kotlinx.serialization, SQLite, Core Data, Keychain
      - label: Testing
        details: XCTest, Swift Testing, unit & integration testing
      - label: Tooling & CI/CD
        details: Xcode, Android Studio, App Store Connect, TestFlight, Fastlane, GitHub Actions, GitLab CI, Git
      - label: Languages (spoken)
        details: English — professional working proficiency; Russian — native

    Education:
      - institution: Perm State Agro-Technological University
        area: Applied Informatics
        degree: B.S.
        end_date: 2014


