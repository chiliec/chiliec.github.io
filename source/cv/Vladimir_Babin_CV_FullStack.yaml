      - label: Architecture
        details: MVVM, Clean Architecture, modularization, offline-first sync
      - label: Testing & Tooling
        details: vitest, Jest, XCTest, GitHub Actions, GitLab CI, Jenkins, Git
      - label: Languages (spoken)
