        start_date: 2026-03
        end_date: 2026-07
        highlights:
          - Delivered client apps across concurrent engagements; integrated backend services and REST APIs, owning asynchronous data flow, error states, and release.

      - company: "[Artwell](https://www.artwell.ru)"
        position: Senior Developer
        location: Remote
        start_date: 2024-06
        end_date: 2025-12
        highlights:
          - Built state-driven UI with real-time updates; designed REST API integration and client-side data modeling for performance and responsiveness.
          - Integrated blockchain/smart-contract state and parsed external data sources.

      - company: "[Symplast](https://symplast.com)"
        position: Senior iOS/macOS Developer
        location: USA, Remote
        start_date: 2021-10
        end_date: 2024-05
        highlights:
          - "Built large-scale apps used daily in US clinics — [live on the App Store](https://apps.apple.com/us/app/symplast-practice/id965799573)."
          - Built reactive data pipelines; implemented secure messaging, video calls, and offline-first synchronization; mentored junior developers and led code reviews.

      - company: "[Pro IT](https://proitr.ru)"
        position: Developer
        location: Russia, Remote
        start_date: 2015-02
        end_date: 2021-10
        highlights:
          - Shipped multiple production apps with REST networking layers and reusable UI components; automated build/test/release pipelines (Fastlane, CI).

