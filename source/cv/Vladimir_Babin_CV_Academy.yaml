cv:
  name: Vladimir Babin
  headline: "Senior Software Engineer — AI Systems & Apple Platforms"
  email: vovababin@gmail.com
  social_networks:
    - network: GitHub
      username: chiliec
    - network: LinkedIn
      username: vovababin
    - network: Telegram
      username: babin

  sections:
    Summary:
      - 10+ years shipping native iOS and macOS software, now an AI engineer building multi-agent and voice AI systems — based in Bali, Indonesia.
      - "Applying to the Apple Developer Academy to make the jump from engineer-for-hire to product creator — building AI-native Apple products like TalkNative through Challenge-Based Learning and interdisciplinary teamwork."
      - Self-taught my whole career; the Academy's structured, community-driven format is how I want to grow next — while putting down roots in Indonesia's tech community.

    Experience:
      - company: "[Axveer](https://axveer.com)"
        position: AI Engineer
        location: Bali, Indonesia
        start_date: 2026-02
        end_date: present
        highlights:
          - Build production multi-agent workflows on the Anthropic Claude API (tool use, orchestration, structured outputs) to automate business operations.
          - Develop voice AI agents for 24/7 call answering and booking automation, integrating telephony with LLM-driven conversation flows.
          - Build retrieval-augmented (RAG) backends and evaluation pipelines to ground agents in client data and reduce hallucinations.

      - company: "[Artwell](https://www.artwell.ru)"
        position: Senior iOS Developer
        location: Remote
        start_date: 2024-06
        end_date: 2025-12
        highlights:
          - Owned development of a production SwiftUI iOS application with state-driven, real-time UI (Combine, async/await).
          - Integrated TON blockchain data and smart-contract state into the app, parsing on-chain data with async updates.

      - company: "[Symplast](https://symplast.com)"
        position: Senior iOS/macOS Developer
        location: USA, Remote
        start_date: 2021-10
        end_date: 2024-05
        highlights:
          - Developed large-scale iOS and macOS healthcare applications with high reliability requirements.
          - Led migration of a 100k+ LoC Objective-C codebase to modern Swift; reduced crash rate by ~40%.
          - Implemented secure messaging, video calls, and offline-first synchronization.
          - Mentored junior developers and drove architectural decisions (MVVM, Clean Architecture).

      - company: "[Pro IT](https://proitr.ru)"
        position: iOS Developer
        location: Russia
        start_date: 2015-02
        end_date: 2021-10
        highlights:
          - Built multiple production native iOS applications (UIKit, Auto Layout) over six years.
          - Automated build, test, and release pipelines with Fastlane; maintained CI/CD.

    Personal Projects (see portfolio):
      - label: TalkNative
        details: On-device iOS text enhancer built on Apple Foundation Models (iOS 26 beta) — all processing stays on the phone
      - label: Indonesian Conversation Bot
        details: Voice role-play Telegram bot for Bali expats learning Bahasa Indonesia (Claude, Deepgram, Google TTS)
      - label: ClaudeBar
        details: Native macOS menu bar app for Claude.ai usage — shipped via my own Homebrew tap

    Extracurricular & Community:
      - Learning Bahasa Indonesia — and building a conversation bot so other Bali expats can learn it too.
      - Run validator/infrastructure for the VIZ blockchain; long-time TON ecosystem participant.
      - 10+ years of open source — yii2-vote (70★) maintained since 2014.

    Education:
      - institution: Perm State Agricultural Academy
        area: Applied Informatics
        degree: B.S.
        end_date: 2014

    Technical Skills:
      - label: AI / LLM
        details: Anthropic Claude API, multi-agent orchestration, tool use & MCP, RAG, prompt engineering, voice AI
      - label: Apple
        details: Swift, SwiftUI, UIKit, Combine, Swift Concurrency, Apple Foundation Models, Objective-C
      - label: Architecture
        details: MVVM, Clean Architecture, modularization, REST API design
      - label: Tooling & Process
        details: Xcode, Git, Fastlane, GitHub Actions, CI/CD, Agile/Scrum
      - label: Blockchain
        details: TON, VIZ — on-chain data integration and infrastructure

    Languages:
      - label: Russian
        details: Native
      - label: English
        details: B2
      - label: Bahasa Indonesia
        details: Beginner — actively learning

