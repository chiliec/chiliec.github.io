cv:
  name: Vladimir Babin
  headline: "Senior iOS/macOS Engineer — Swift, SwiftUI, UIKit"
  location: Remote
  email: vovababin@gmail.com
  website: https://chiliec.github.io
  social_networks:
    - network: Telegram
      username: babin
    - network: GitHub
      username: chiliec
    - network: LinkedIn
      username: vovababin

  sections:
    Summary:
      - Senior iOS/macOS engineer with 10+ years shipping production native Apple apps — healthcare at scale, fintech, and blockchain products. Swift, SwiftUI, UIKit, Swift Concurrency.
      - Cut crash rate ~40% in a clinical-reliability healthcare product used daily in US clinics; ships independently — a native macOS app distributed through my own Homebrew tap.

    Experience:
      - company: Independent
        position: Senior iOS/macOS Engineer
        location: Remote
        start_date: 2026-02
        end_date: present
        highlights:
          - Built and shipped ClaudeBar, a native macOS menu-bar app in pure Swift — signed, notarized, and distributed publicly through my own Homebrew tap.
          - Built TalkNative, an iOS app structured as four independent Swift packages, each with its own test suite.
      - company: "[Artwell](https://www.artwell.ru)"
        position: Senior iOS Developer
        location: Remote
        start_date: 2024-06
        end_date: 2025-12
        highlights:
          - Owned a production SwiftUI iOS app end to end, building state-driven UI with real-time updates (Combine, async/await).
          - Integrated TON blockchain and smart-contract state, parsing on-chain data and handling async updates.
          - Designed REST API integration and client-side data modeling with a focus on performance and UI responsiveness.

      - company: "[Symplast](https://symplast.com)"
        position: Senior iOS/macOS Developer
        location: USA, Remote
        start_date: 2021-10
        end_date: 2024-05
        highlights:
          - "Built and maintained large-scale iOS/macOS healthcare apps used daily in US plastic-surgery clinics — [live on the App Store](https://apps.apple.com/us/app/symplast-practice/id965799573)."
          - Reduced crash rate by ~40% through refactoring, monitoring, and defensive coding.
          - Built reactive data pipelines (Combine, Swift Concurrency, GCD) that cut UI bugs and race conditions.
          - Implemented secure messaging, video calls, and offline-first synchronization.
          - Mentored junior developers and drove code reviews and architectural decisions.

      - company: "[Pro IT](https://proitr.ru)"
        position: iOS Developer
        location: Russia
        start_date: 2015-02
        end_date: 2021-10
        highlights:
          - Shipped multiple production native iOS apps (UIKit, Auto Layout), building reusable UI components and REST networking layers (URLSession, Alamofire).
          - Automated build, test, and release pipelines with Fastlane, improving release stability.

    Education:
      - institution: Perm State Agricultural Academy
        area: Applied Informatics
        degree: B.S.
        end_date: 2014

    Technical Skills:
      - label: Platforms
        details: iOS, macOS, iPadOS
      - label: Languages & UI
        details: Swift, SwiftUI, UIKit, Auto Layout, SnapKit
      - label: Concurrency
        details: Swift Concurrency (async/await, Actors), Combine, GCD, OperationQueue
      - label: Architecture
        details: MVVM, Clean Architecture, VIPER, modularization, SPM, CocoaPods
      - label: Data & Networking
        details: Core Data, SQLite, Keychain, offline-first sync, REST/URLSession, Alamofire, Codable
      - label: Testing
        details: XCTest, Swift Testing, unit & integration testing
      - label: Tooling & CI/CD
        details: Xcode, Instruments, App Store Connect, TestFlight, Fastlane, GitHub Actions, GitLab CI, Jenkins, code signing & notarization, Git
      - label: Languages (spoken)
        details: Russian — native; English — professional working proficiency


