        location: Remote
        start_date: 2026-07
        end_date: present
        highlights:
          - "Took four apps from idea to the App Store in ten weeks — three on Kotlin Multiplatform/Compose for iOS and Android ([BaliSurf](https://github.com/chiliec/balisurf), [SLOVO](https://github.com/chiliec/slovo), [Lancar](https://github.com/chiliec/indonesian-app)), one pure SwiftUI/SwiftData ([Callback](https://github.com/chiliec/Callback))."
