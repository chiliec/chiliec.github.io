cv:
  name: Vladimir Babin
  headline: "Senior Software Engineer — AI Systems & Apple Platforms"
  email: vovababin@gmail.com
  social_networks:
    - network: Telegram
      username: babin
    - network: GitHub
      username: chiliec
    - network: LinkedIn
      username: vovababin

  sections:
    Summary:
      - Senior software engineer with 10+ years shipping production applications, now focused on AI systems — multi-agent workflows, LLM-powered backends, and voice AI.
      - "Builds agentic systems on the Anthropic Claude API: tool use, multi-agent orchestration, structured outputs, and retrieval-augmented (RAG) pipelines."
      - Brings production rigor from a decade of native Apple-platform work (Swift, SwiftUI, UIKit) — architecture, concurrency, performance — to AI product development.
      - Experience integrating LLMs and on-chain (TON) blockchain data into real, end-to-end products.
      - "Comfortable across the stack: API design/integration, async data pipelines, CI/CD, Agile teams."

    Experience:
      - company: "[Axveer](https://axveer.com)"
        position: AI Engineer
        location: Bali, Indonesia
        start_date: 2026-02
        end_date: present
        highlights:
          - Build production multi-agent workflows on the Anthropic Claude API (tool use, orchestration, structured outputs) to automate business operations.
          - Developed voice AI agents for 24/7 call answering and booking automation, integrating telephony with LLM-driven conversation flows.
          - Built retrieval-augmented (RAG) backends to ground agent responses in client and domain data.
          - Designed prompt and evaluation pipelines to improve agent reliability and reduce hallucinations.
      - company: "[Artwell](https://www.artwell.ru)"
        position: Senior iOS Developer
        location: Remote
        start_date: 2024-06
        end_date: 2025-12
        highlights:
          - Owned development of a production SwiftUI-based iOS application.
          - Designed and implemented state-driven UI with real-time updates using Combine and async/await.
          - Integrated TON blockchain data and smart-contract state into the app, including parsing on-chain data and handling async updates.
          - Worked extensively with REST APIs and client-side data modeling.
          - Collaborated in an Agile/Scrum environment with backend and product teams.
          - Focused on performance optimization, memory usage, and UI responsiveness.

      - company: "[Symplast](https://symplast.com)"
        position: Senior iOS/macOS Developer
        location: USA, Remote
        start_date: 2021-10
        end_date: 2024-05
        highlights:
          - Developed and maintained large-scale iOS and macOS healthcare applications with high reliability requirements.
          - Led migration of a large Objective-C codebase (100k+ LoC) to modern Swift.
          - Designed modular architecture using MVVM and Clean Architecture principles.
          - Built reactive data pipelines with Combine, reducing UI-related bugs and race conditions.
          - Implemented secure messaging, video calls, and offline-first synchronization.
          - Actively used GCD, OperationQueue, and Swift Concurrency for complex async workflows.
          - Reduced crash rate by ~40% through refactoring, monitoring, and defensive coding.
          - Mentored junior developers and participated in code reviews and architectural decisions.

      - company: "[Pro IT](https://proitr.ru)"
        position: iOS Developer
        location: Russia
        start_date: 2015-02
        end_date: 2021-10
        highlights:
          - Developed multiple production-grade native iOS applications using UIKit and Auto Layout.
          - Built reusable UI components and adaptive layouts.
          - Worked with networking layers using URLSession and Alamofire.
          - Automated build, test, and release pipelines using Fastlane.
          - Maintained CI/CD pipelines and improved release stability.
          - Used Git daily and participated in Agile development processes.

    Education:
      - institution: Perm State Agricultural Academy
        area: Applied Informatics
        degree: B.S.
        end_date: 2014

    Technical Skills:
      - label: AI / LLM
        details: Anthropic Claude API, multi-agent orchestration, tool use & MCP, RAG, prompt engineering, voice AI
      - label: Languages
        details: Swift, Objective-C
      - label: Apple Platforms
        details: iOS, macOS, iOS SDK
      - label: Apple Frameworks
        details: SwiftUI, UIKit, Combine, Foundation
      - label: Concurrency
        details: GCD, Swift Concurrency (async/await, Actors)
      - label: Architecture
        details: MVVM, Clean Architecture, VIPER, OOP, modularization
      - label: Networking
        details: REST API integration, URLSession, Alamofire
      - label: UI & Layout
        details: Auto Layout, SnapKit, performance-critical UI
      - label: Tooling
        details: Xcode, Git, Fastlane, Charles
      - label: CI/CD
        details: CI/CD pipelines, GitHub Actions, GitLab CI, Jenkins
      - label: Process
        details: Agile, Scrum, Atlassian Jira
      - label: Blockchain
        details: TON blockchain, smart-contract data integration (client-side)

    Languages:
      - label: Russian
        details: Native
      - label: English
        details: B2


