cv:
  name: Vladimir Babin
  headline: "Senior iOS/macOS Engineer · Remote since 2015"
  email: vovababin@gmail.com
  website: https://chiliec.github.io/portfolio
  social_networks:
    - network: Telegram
      username: babin
    - network: GitHub
      username: chiliec
    - network: LinkedIn
      username: vovababin

  sections:
    Summary:
      - Senior iOS/macOS engineer with 11 years shipping production native Apple apps — healthcare at scale, blockchain, and multi-client delivery. Swift, SwiftUI, UIKit, Swift Concurrency.
      - Own delivery end to end — modular architecture, offline-first sync, and Kotlin Multiplatform on projects that share logic with Android.

    Experience:
      - company: "[Axveer](https://axveer.com)"
        position: Software Engineer
        location: USA, Remote
        start_date: 2026-03
        end_date: 2026-07
        highlights:
          - Shipped iOS apps across multiple concurrent client engagements — some fully SwiftUI, others on shared Kotlin Multiplatform modules.
          - Took each project from kickoff to a first TestFlight build, owning provisioning, signing, and release.
          - Integrated backend services and REST APIs, handling asynchronous data flow and error states on the client.

      - company: "[Artwell](https://www.artwell.ru)"
        position: Senior iOS Developer
        location: Remote
        start_date: 2024-06
        end_date: 2025-12
        highlights:
          - Owned a production SwiftUI iOS app end to end, building state-driven UI with real-time updates (Combine, async/await).
          - Integrated TON blockchain and smart-contract state, parsing on-chain data and handling async updates.
          - Designed REST API integration and client-side data modeling with a focus on performance and UI responsiveness.

      - company: "[Symplast](https://symplast.com)"
        position: Senior iOS/macOS Developer
        location: USA, Remote
        start_date: 2021-10
        end_date: 2024-05
        highlights:
          - "Built and maintained large-scale iOS/macOS healthcare apps used daily in US plastic-surgery clinics — [live on the App Store](https://apps.apple.com/us/app/symplast-practice/id965799573)."
          - Drove crash-rate reduction through crash-report triage, refactoring, and defensive coding.
          - Built reactive data pipelines (Combine, Swift Concurrency, GCD) that cut UI bugs and race conditions.
          - Implemented secure messaging, video calls, and offline-first synchronization.
          - Mentored junior developers and drove code reviews and architectural decisions.

      - company: "[Pro IT](https://proitr.ru)"
        position: iOS Developer
        location: Russia, Remote
        start_date: 2015-02
        end_date: 2021-10
        highlights:
          - Shipped multiple production native iOS apps (UIKit, Auto Layout, SnapKit), building reusable UI components and REST networking layers (URLSession, Alamofire).
          - Automated build, test, and release pipelines with Fastlane, improving release stability.

    Open-Source Contributions:
      - "**7 fixes merged** into external open-source projects incl. [OpenTelemetry-Go](https://github.com/open-telemetry/opentelemetry-go/pull/8832) (panic on negative reservoir size), [LangChain.js](https://github.com/langchain-ai/langchainjs/pull/11534), and [HDF5](https://github.com/scigolib/hdf5/pull/63) (uint16-overflow panic) — each reproduced with a failing test before fixing."
      - "Systematic memory-safety bug-hunting across Go, Rust, and TypeScript — integer-overflow and out-of-bounds panics on untrusted input (e.g. [gopacket/mandiant](https://github.com/mandiant/gopacket/pull/47), [gxpdf](https://github.com/coregx/gxpdf/pull/93), [cockroachdb/apd](https://github.com/cockroachdb/apd/pull/152))."
      - "Performance & correctness fixes to widely-used libraries — eliminated an O(n²) hot path in [goccy/go-yaml](https://github.com/goccy/go-yaml/pull/929) (~280× faster, byte-identical output) and brought [goccy/go-json](https://github.com/goccy/go-json/pull/608) struct decoding to standard-library parity."
      - "Full portfolio: [chiliec.github.io/portfolio](https://chiliec.github.io/portfolio) · [github.com/chiliec](https://github.com/chiliec) — 20+ additional PRs under maintainer review."

    Technical Skills:
      - label: Platforms
        details: iOS, macOS, iPadOS
      - label: Languages & UI
        details: Swift, SwiftUI, UIKit, Auto Layout, Kotlin Multiplatform (KMP)
      - label: Concurrency
        details: Swift Concurrency (async/await, Actors), Combine, GCD, OperationQueue
      - label: Architecture
        details: MVVM, Clean Architecture, VIPER, modularization, SPM, CocoaPods
      - label: Data & Networking
        details: Core Data, SQLite, Keychain, offline-first sync, REST/URLSession, Alamofire, Codable
      - label: Testing
        details: XCTest, Swift Testing, unit & integration testing
      - label: Tooling & CI/CD
        details: Xcode, Instruments, App Store Connect, TestFlight, Fastlane, GitHub Actions, GitLab CI, Jenkins, Git
      - label: Languages (spoken)
        details: English — professional working proficiency; Russian — native

    Education:
      - institution: Perm State Agro-Technological University
        area: Applied Informatics
        degree: B.S.
        end_date: 2014


