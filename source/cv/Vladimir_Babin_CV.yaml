          - Led a 100k+ LoC Objective-C → Swift migration onto modular MVVM/Clean Architecture; cut crash rate ~40%.
          - Built reactive data pipelines (Combine, Swift Concurrency, GCD) removing a class of race conditions; offline-first sync.
          - Drove code reviews and architectural decisions, mentoring junior developers.

