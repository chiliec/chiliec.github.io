design:
  theme: engineeringresumes
  page:
    size: us-letter
    top_margin: 0.5in
    bottom_margin: 0.5in
    left_margin: 0.65in
    right_margin: 0.65in
    show_footer: true
    show_top_note: false
  colors:
    body: rgb(26, 26, 28)
    name: rgb(26, 26, 28)
    headline: rgb(70, 78, 92)
    connections: rgb(90, 90, 95)
    section_titles: rgb(26, 26, 28)
    links: rgb(0, 79, 144)
    footer: rgb(150, 150, 155)
    top_note: rgb(150, 150, 155)
  typography:
    line_spacing: 0.5em
    font_family:
      body: Source Sans 3
      name: XCharter
      headline: XCharter
      connections: Source Sans 3
      section_titles: Source Sans 3
    font_size:
      body: 10pt
      name: 26pt
      headline: 10.5pt
      connections: 9.5pt
      section_titles: 1.1em
    small_caps:
      name: false
      headline: false
      connections: false
      section_titles: true
    bold:
      name: true
      headline: false
      connections: false
      section_titles: true
    alignment: left
    date_and_location_column_alignment: right
