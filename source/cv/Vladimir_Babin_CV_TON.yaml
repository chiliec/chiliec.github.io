cv:
  name: Vladimir Babin
  headline: "Web3 Product Engineer — TON & Telegram Mini Apps · Remote since 2015"
  email: vovababin@gmail.com
  website: https://chiliec.github.io/portfolio
  social_networks:
    - network: Telegram
      username: babin
    - network: GitHub
      username: chiliec
    - network: LinkedIn
      username: vovababin

  sections:
    Summary:
      - "Product engineer with 11 years shipping software, specialized in the TON ecosystem: Telegram bots and Mini Apps in TypeScript, on-chain data integration, and smart contracts (Tact) deployed to mainnet."
      - I build the whole product — client, bot backend, and the contract layer — and I ship native mobile too, so Web3 UX actually feels like a real app.

    Experience:
      - company: "[Axveer](https://axveer.com)"
        position: Software Engineer
        location: USA, Remote
        start_date: 2026-03
        end_date: 2026-07
        highlights:
          - Built client apps and integrated backend/REST services across concurrent engagements, owning asynchronous data flow, error states, and release.

      - company: "[Artwell](https://www.artwell.ru)"
        position: Senior Developer (Blockchain/Mobile)
        location: Remote
        start_date: 2024-06
        end_date: 2025-12
        highlights:
          - Integrated TON blockchain and smart-contract state into a production app — parsing on-chain data, handling async updates and error states.
          - Built state-driven UI with real-time updates; designed REST API integration and client-side data modeling.

      - company: "[Symplast](https://symplast.com)"
        position: Senior iOS/macOS Developer
        location: USA, Remote
        start_date: 2021-10
        end_date: 2024-05
        highlights:
          - "Built large-scale apps used daily in US clinics — [live on the App Store](https://apps.apple.com/us/app/symplast-practice/id965799573)."
          - Implemented secure messaging, video calls, and offline-first synchronization; drove crash-rate reduction and mentored junior developers.

      - company: "[Pro IT](https://proitr.ru)"
        position: Developer
        location: Russia, Remote
        start_date: 2015-02
        end_date: 2021-10
        highlights:
          - Shipped multiple production apps and REST networking layers; automated build/test/release pipelines with Fastlane.

    Technical Skills:
      - label: Blockchain
        details: TON, Tact smart contracts (mainnet), on-chain data parsing, wallet integration, TON Connect
      - label: Telegram
        details: Bots, Mini Apps / WebApps, bot backends
      - label: Languages & Web
        details: TypeScript, JavaScript, Node.js, React, HTML/CSS
      - label: Mobile
        details: Swift, SwiftUI, Kotlin Multiplatform (for native Web3 clients)
      - label: Backend & Data
        details: REST APIs, asynchronous data flow, SQLite, PostgreSQL
      - label: Testing & Tooling
        details: vitest, Jest, GitHub Actions, GitLab CI, Git
      - label: Languages (spoken)
        details: English — professional working proficiency; Russian — native

    Education:
      - institution: Perm State Agro-Technological University
        area: Applied Informatics
        degree: B.S.
        end_date: 2014


